name: One-shot approved Jones cache refresh
on:
  push:
    branches: [main]
    paths: ['corrections/cache-refresh-control.json']
permissions:
  contents: read
concurrency:
  group: sportsms-daily-editions
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pytest
      - name: Test post-specific cache refresh
        run: python -m pytest tests/test_jones_cache_refresh.py -q
      - name: Check fresh approved snapshot and save same title once
        env:
          WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: python scripts/refresh_jones_cache.py
      - name: Save sanitized cache-refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jones-cache-refresh-${{ github.run_id }}
          path: cache-refresh-output/
          retention-days: 14
