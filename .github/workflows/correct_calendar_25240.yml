name: One-shot calendar chronology correction 25240
on:
  push:
    branches: [correct-calendar-25240-20261027]
    paths: ['calendar-correction/control.json']
permissions:
  contents: read
concurrency:
  group: calendar-correction-25240-20261027
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=src python -m pytest -q tests/test_calendar_25240_correction.py
      - name: Reconcile exact post and dry-run or apply reviewed body correction
        env:
          WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          PYTHONPATH: src
        run: python scripts/correct_calendar_25240_20261027.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-25240-correction-receipt
          path: calendar-correction-output/
          retention-days: 30
