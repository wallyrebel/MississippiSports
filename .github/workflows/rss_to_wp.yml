name: RSS to WordPress Automation

on:
  schedule:
    # Run every 60 minutes
    - cron: '0 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no publishing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      single_feed:
        description: 'Process only a specific feed (by name)'
        required: false
        default: ''
        type: string

env:
  PYTHON_VERSION: '3.11'

# The job only reads the repository; publishing uses the WordPress secrets.
permissions:
  contents: read

# A manual run and the hourly schedule must never publish the same story twice.
concurrency:
  group: rss-to-wp-publish
  cancel-in-progress: false

jobs:
  process-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Create data directory
        run: mkdir -p data

      - name: Restore database from cache
        uses: actions/cache/restore@v4
        with:
          path: data/processed.db
          key: processed-db-${{ github.run_id }}
          restore-keys: |
            processed-db-

      - name: Run RSS to WordPress
        env:
          # OpenAI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-6-luna' }}
          
          # WordPress
          WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_POST_STATUS: ${{ secrets.WORDPRESS_POST_STATUS || 'publish' }}
          
          # Image providers (optional)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          
          # Logging
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'INFO' }}
          TIMEZONE: ${{ secrets.TIMEZONE || 'UTC' }}
          
          # Email notifications (optional)
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_SINGLE_FEED: ${{ github.event.inputs.single_feed }}
        run: |
          ARGS=(--config feeds.yaml)
          
          # Add dry-run flag if specified
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          
          # Add single-feed flag if specified
          if [ -n "$INPUT_SINGLE_FEED" ]; then
            ARGS+=(--single-feed "$INPUT_SINGLE_FEED")
          fi
          
          python -m rss_to_wp run "${ARGS[@]}"

      # Save even when the run step fails or times out: stories published
      # before the failure must stay recorded or the next run posts them again.
      - name: Save database to cache
        if: always() && hashFiles('data/processed.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/processed.db
          key: processed-db-${{ github.run_id }}

      # One line per story decision (published, rejected, held) with the reason
      # and the specific values that tripped a check.
      - name: Upload rewrite audit trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewrite-audit-${{ github.run_id }}
          path: data/rewrite-audit.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always()
        env:
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_SINGLE_FEED: ${{ github.event.inputs.single_feed }}
        run: |
          echo "## RSS to WordPress Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "- **Dry Run**: ${INPUT_DRY_RUN:-false}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Single Feed**: ${INPUT_SINGLE_FEED:-All feeds}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f data/processed.db ]; then
            COUNT=$(sqlite3 data/processed.db "SELECT COUNT(*) FROM processed_entries;" 2>/dev/null || echo "N/A")
            echo "- **Total Processed Entries**: $COUNT" >> $GITHUB_STEP_SUMMARY
            HELD=$(sqlite3 data/processed.db "SELECT COUNT(*) FROM rewrite_rejections WHERE attempts >= 3;" 2>/dev/null || echo "N/A")
            echo "- **Stories held for an editor**: $HELD" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f data/rewrite-audit.jsonl ]; then
            echo "- **Published this run**: $(grep -c '"decision": "published"' data/rewrite-audit.jsonl || true)" >> $GITHUB_STEP_SUMMARY
            echo "- **Rejected or held this run**: $(grep -cE '"decision": "(rejected|held)"' data/rewrite-audit.jsonl || true)" >> $GITHUB_STEP_SUMMARY
          fi
