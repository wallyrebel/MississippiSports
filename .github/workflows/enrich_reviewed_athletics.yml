name: One-shot reviewed athletics body enrichment
on:
  push:
    branches: [enrich-reviewed-athletics-20261027]
    paths: ['reviewed-enrichment/control.json']
permissions:
  contents: read
concurrency:
  group: reviewed-athletics-enrichment-20261027
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=src python -m pytest -q tests/test_reviewed_athletics_enrichment.py
      - name: Reconcile reviewed posts and dry-run or apply pinned body patches
        env:
          WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          PYTHONPATH: src
        run: python scripts/enrich_reviewed_athletics_20261027.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-athletics-enrichment-receipt
          path: enrichment-output/
          retention-days: 30
